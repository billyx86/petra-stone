<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f5f7"/>
    </linearGradient>
    <radialGradient id="stone" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#d2d2d7"/>
      <stop offset="1" stop-color="#a1a1a6"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="rgba(0,0,0,0.14)"/>
      <stop offset="1" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- the pebble -->
  <ellipse cx="865" cy="512" rx="205" ry="30" fill="url(#shadow)"/>
  <path d="M 690 340
           C 690 245 765 172 872 168
           C 985 164 1058 240 1062 330
           C 1066 425 992 502 878 507
           C 768 512 690 438 690 340 Z"
        fill="url(#stone)"/>
  <!-- titanium flecks -->
  <g fill="#86868b" opacity="0.35">
    <circle cx="800" cy="270" r="4"/>
    <circle cx="930" cy="330" r="3"/>
    <circle cx="860" cy="420" r="5"/>
    <circle cx="975" cy="410" r="3"/>
    <circle cx="760" cy="360" r="3"/>
    <circle cx="1000" cy="280" r="2.5"/>
  </g>

  <!-- wordmark -->
  <text x="84" y="308" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="132" font-weight="600" letter-spacing="-4" fill="#1d1d1f">Petra</text>
  <text x="88" y="382" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="44" font-weight="400" fill="#6e6e73">The rock, reimagined.</text>
  <text x="88" y="470" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#86868b">Engineered density. Timeless silence. From $999.</text>

  <!-- footer -->
  <rect x="88" y="540" width="44" height="6" rx="3" fill="#0066cc"/>
  <text x="88" y="588" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="24" fill="#86868b">billyx86.github.io/petra-stone</text>
</svg>
